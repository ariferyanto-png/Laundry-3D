<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry 3D Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e0e5ec;
            color: #2d3748;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Claymorphism / Neumorphism Styles */
        .clay-card {
            background: #e0e5ec;
            border-radius: 1.25rem;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), 
                       -9px -9px 16px rgba(255,255,255, 0.5),
                       inset 2px 2px 4px rgba(255,255,255,0.4),
                       inset -2px -2px 4px rgba(0,0,0,0.05);
        }

        .clay-btn {
            background: #e0e5ec;
            border-radius: 1rem;
            box-shadow: 5px 5px 10px rgb(163,177,198,0.6), 
                       -5px -5px 10px rgba(255,255,255, 0.5);
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .clay-btn:active {
            box-shadow: inset 5px 5px 10px rgb(163,177,198,0.6), 
                       inset -5px -5px 10px rgba(255,255,255, 0.5);
            transform: translateY(2px);
        }

        .clay-btn-primary {
            background: #4ade80;
            color: white;
            box-shadow: 5px 5px 10px rgb(163,177,198,0.6), 
                       -5px -5px 10px rgba(255,255,255, 0.5),
                       inset 3px 3px 6px rgba(255,255,255,0.4),
                       inset -3px -3px 6px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .clay-btn-primary:active {
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.2), 
                       inset -5px -5px 10px rgba(255,255,255, 0.4);
        }

        .clay-btn-danger {
            background: #f87171;
            color: white;
            box-shadow: 5px 5px 10px rgb(163,177,198,0.6), 
                       -5px -5px 10px rgba(255,255,255, 0.5),
                       inset 3px 3px 6px rgba(255,255,255,0.4),
                       inset -3px -3px 6px rgba(0,0,0,0.2);
        }

        .clay-input {
            background: #e0e5ec;
            border: none;
            border-radius: 0.75rem;
            box-shadow: inset 5px 5px 10px rgb(163,177,198,0.6), 
                       inset -5px -5px 10px rgba(255,255,255, 0.5);
            padding: 0.75rem 1rem;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }

        .clay-input:focus {
            box-shadow: inset 7px 7px 12px rgb(163,177,198,0.7), 
                       inset -7px -7px 12px rgba(255,255,255, 0.6);
        }

        /* 3D Colorful Cards */
        .card-3d-blue { background: linear-gradient(145deg, #3b82f6, #60a5fa); color: white; box-shadow: 5px 5px 15px rgba(59,130,246,0.4), inset 2px 2px 5px rgba(255,255,255,0.4), inset -3px -3px 5px rgba(0,0,0,0.2); border-radius: 1.25rem; }
        .card-3d-green { background: linear-gradient(145deg, #10b981, #34d399); color: white; box-shadow: 5px 5px 15px rgba(16,185,129,0.4), inset 2px 2px 5px rgba(255,255,255,0.4), inset -3px -3px 5px rgba(0,0,0,0.2); border-radius: 1.25rem; }
        .card-3d-orange { background: linear-gradient(145deg, #f97316, #fb923c); color: white; box-shadow: 5px 5px 15px rgba(249,115,22,0.4), inset 2px 2px 5px rgba(255,255,255,0.4), inset -3px -3px 5px rgba(0,0,0,0.2); border-radius: 1.25rem; }
        .card-3d-red { background: linear-gradient(145deg, #ef4444, #f87171); color: white; box-shadow: 5px 5px 15px rgba(239,68,68,0.4), inset 2px 2px 5px rgba(255,255,255,0.4), inset -3px -3px 5px rgba(0,0,0,0.2); border-radius: 1.25rem; }

        .icon-3d {
            font-size: 2.5rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        /* Bottom Nav */
        .bottom-nav {
            background: rgba(224, 229, 236, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        .nav-item {
            transition: transform 0.2s;
        }
        .nav-item.active {
            color: #4f46e5;
            transform: scale(1.1);
            text-shadow: 0px 2px 4px rgba(79,70,229,0.3);
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Print Styles for 58mm Thermal Printer */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm; /* Thermal paper width */
                margin: 0;
                padding: 0;
                font-family: monospace;
                font-size: 12px;
                color: black;
                background: white;
            }
            .no-print { display: none !important; }
        }

        /* Custom Modal */
        .modal-overlay {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.4), inset -1px -1px 3px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- Login Screen -->
    <div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-[#e0e5ec]">
        <div class="clay-card p-8 w-full max-w-sm flex flex-col items-center">
            <div class="text-6xl mb-4 icon-3d">🧺</div>
            <h1 class="text-2xl font-bold mb-2 text-center text-indigo-600">Laundry 3D</h1>
            <p class="text-sm text-gray-500 mb-6 text-center">Masukkan sandi untuk masuk</p>
            
            <input type="password" id="login-password" class="clay-input mb-6 text-center text-xl" placeholder="••••••••">
            
            <button onclick="handleLogin()" class="clay-btn clay-btn-primary w-full py-3 text-lg">Masuk Aplikasi</button>
            <p class="text-xs text-gray-400 mt-4">Demo Sandi: admin123</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="flex-1 overflow-y-auto pb-24 hidden relative">
        
        <!-- Header -->
        <div class="sticky top-0 z-30 bg-[#e0e5ec] bg-opacity-90 backdrop-blur-md p-4 shadow-sm flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl icon-3d">🧺</span>
                <h1 class="font-bold text-xl text-indigo-800" id="header-title">Dashboard</h1>
            </div>
            <div class="clay-card px-3 py-1 text-xs font-bold text-green-600 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Online
            </div>
        </div>

        <!-- Views Container -->
        <div class="p-4 space-y-6" id="view-container">
            <!-- Content dynamically rendered here -->
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div id="bottom-nav" class="bottom-nav fixed bottom-0 w-full h-16 flex justify-around items-center z-40 hidden pb-safe">
        <button onclick="switchView('dashboard')" class="nav-item active flex flex-col items-center p-2 w-1/5" id="nav-dashboard">
            <span class="text-xl">📊</span>
            <span class="text-[9px] font-semibold mt-1">Dashboard</span>
        </button>
        <button onclick="switchView('transactions', 'all')" class="nav-item flex flex-col items-center p-2 w-1/5" id="nav-transactions">
            <span class="text-xl">📝</span>
            <span class="text-[9px] font-semibold mt-1">Transaksi</span>
        </button>
        <button onclick="switchView('master')" class="nav-item flex flex-col items-center p-2 w-1/5" id="nav-master">
            <span class="text-xl">📁</span>
            <span class="text-[9px] font-semibold mt-1">Data</span>
        </button>
        <button onclick="switchView('reports')" class="nav-item flex flex-col items-center p-2 w-1/5" id="nav-reports">
            <span class="text-xl">📈</span>
            <span class="text-[9px] font-semibold mt-1">Laporan</span>
        </button>
        <button onclick="switchView('settings')" class="nav-item flex flex-col items-center p-2 w-1/5" id="nav-settings">
            <span class="text-xl">⚙️</span>
            <span class="text-[9px] font-semibold mt-1">Pengaturan</span>
        </button>
    </div>

    <!-- Print Area (Hidden on screen, visible on print) -->
    <div id="print-area" class="hidden"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none">
        <div class="clay-card bg-gray-800 text-white px-4 py-2 text-sm flex items-center gap-2 shadow-xl border border-gray-700">
            <span id="toast-icon">✅</span>
            <span id="toast-msg">Pesan sukses</span>
        </div>
    </div>

    <!-- Generic Form Modal -->
    <div id="form-modal" class="modal-overlay fixed inset-0 z-50 hidden flex justify-center items-end sm:items-center">
        <div class="clay-card w-full sm:w-96 p-6 rounded-b-none sm:rounded-2xl transform transition-transform duration-300 translate-y-full" id="form-modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold" id="modal-title">Judul Form</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div id="modal-body" class="space-y-4 max-h-[60vh] overflow-y-auto p-1">
                <!-- Form fields injected here -->
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="closeModal()" class="clay-btn flex-1 py-2 text-gray-600">Batal</button>
                <button id="modal-save-btn" class="clay-btn clay-btn-primary flex-1 py-2">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Action/Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay fixed inset-0 z-[60] hidden flex justify-center items-center p-4">
        <div class="clay-card w-full max-w-xs p-6 text-center">
            <div id="confirm-icon" class="text-4xl mb-2 icon-3d">❓</div>
            <h3 id="confirm-title" class="font-bold text-lg mb-2">Konfirmasi</h3>
            <p id="confirm-msg" class="text-sm text-gray-600 mb-6">Apakah Anda yakin?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirm()" class="clay-btn flex-1 py-2 text-gray-600">Batal</button>
                <button id="confirm-yes-btn" class="clay-btn clay-btn-danger flex-1 py-2">Ya, Yakin</button>
            </div>
        </div>
    </div>

        <!-- Transaction Detail Modal -->
    <div id="trx-detail-modal" class="modal-overlay fixed inset-0 z-[70] hidden flex justify-center items-end sm:items-center">
        <div class="clay-card w-full sm:w-96 p-6 rounded-b-none sm:rounded-2xl transform transition-transform duration-300 translate-y-full" id="trx-detail-modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Detail Transaksi</h2>
                <button onclick="closeTrxDetailModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div id="trx-detail-body" class="space-y-4 max-h-[60vh] overflow-y-auto p-1 text-sm">
                <!-- Detail transaksi di-inject di sini -->
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="closeTrxDetailModal()" class="clay-btn flex-1 py-2 text-gray-600">Tutup</button>
            </div>
        </div>
    </div>
    

    <script>
        // State Awal Aplikasi
        window.appState = {
            transactions: [],
            services: [],
            customers: [],
            employees: [],
            currentView: 'dashboard',
            trxFilter: 'all',
            settings: {
                outletName: 'LAUNDRY 3D PRO',
                outletAddress: 'Jl. Bersih Selalu No. 1',
                outletPhone: '08123456789',
                hideOutletName: false,
                hideLogo: false,
                showTrxNumber: true,
                showServiceDetail: true
            }
        };

        // Memuat pengaturan dari memori HP
        const savedSettings = localStorage.getItem('laundry_settings');
        if (savedSettings) {
            try { window.appState.settings = JSON.parse(savedSettings); } catch(e) {}
        }

        const STATUS = {
            ANTRIAN: 'Antrian',
            PROSES: 'Proses',
            SIAP: 'Siap Ambil',
            SELESAI: 'Selesai',
            BATAL: 'Batal'
        };

        // Fungsi menyimpan data ke memori lokal HP (tanpa internet)
        function saveToLocal(colName) {
            localStorage.setItem('laundry_' + colName, JSON.stringify(window.appState[colName]));
        }

        // Fungsi menarik data dari memori lokal HP
        function loadFromLocal(colName) {
            const data = localStorage.getItem('laundry_' + colName);
            if (data) {
                try { window.appState[colName] = JSON.parse(data); } catch(e) {}
            }
        }

        // Jalankan penarikan data saat aplikasi pertama kali dibuka
        ['transactions', 'services', 'customers', 'employees'].forEach(loadFromLocal);

        // Mesin database lokal (Menggantikan Firebase)
        window.dbActions = {
            addTransaction: async (data) => { 
                data.id = Date.now().toString(); 
                data.createdAt = Date.now(); 
                window.appState.transactions.unshift(data); 
                saveToLocal('transactions'); 
                return data.id; 
            },
            updateTransaction: async (id, data) => { 
                const idx = window.appState.transactions.findIndex(t => t.id === id); 
                if(idx > -1) { 
                    window.appState.transactions[idx] = {...window.appState.transactions[idx], ...data, updatedAt: Date.now()}; 
                    saveToLocal('transactions'); 
                } 
            },
            addService: async (data) => { 
                data.id = Date.now().toString(); 
                window.appState.services.push(data); 
                saveToLocal('services'); 
            },
            updateService: async (id, data) => { 
                const idx = window.appState.services.findIndex(s => s.id === id); 
                if(idx > -1) { 
                    window.appState.services[idx] = {...window.appState.services[idx], ...data}; 
                    saveToLocal('services'); 
                } 
            },
            deleteService: async (id) => { 
                window.appState.services = window.appState.services.filter(s => s.id !== id); 
                saveToLocal('services'); 
            },
            addCustomer: async (data) => { 
                data.id = Date.now().toString(); 
                window.appState.customers.push(data); 
                saveToLocal('customers'); 
            },
            updateCustomer: async (id, data) => { 
                const idx = window.appState.customers.findIndex(c => c.id === id); 
                if(idx > -1) { 
                    window.appState.customers[idx] = {...window.appState.customers[idx], ...data}; 
                    saveToLocal('customers'); 
                } 
            },
            deleteCustomer: async (id) => { 
                window.appState.customers = window.appState.customers.filter(c => c.id !== id); 
                saveToLocal('customers'); 
            },
            addEmployee: async (data) => { 
                data.id = Date.now().toString(); 
                window.appState.employees.push(data); 
                saveToLocal('employees'); 
            },
            updateEmployee: async (id, data) => { 
                const idx = window.appState.employees.findIndex(e => e.id === id); 
                if(idx > -1) { 
                    window.appState.employees[idx] = {...window.appState.employees[idx], ...data}; 
                    saveToLocal('employees'); 
                } 
            },
            deleteEmployee: async (id) => { 
                window.appState.employees = window.appState.employees.filter(e => e.id !== id); 
                saveToLocal('employees'); 
            },
        };
    </script>
    

    <script>
        function formatRp(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const d = new Date(timestamp);
            return d.toLocaleDateString('id-ID') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        function showToast(msg, icon = "✅") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        }

        function handleLogin() {
            const pass = document.getElementById('login-password').value;
            if (pass === 'admin123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.add('flex');
                showToast("Berhasil Masuk", "🎉");
                switchView('dashboard');
            } else {
                showToast("Sandi Salah!", "❌");
            }
        }

        window.switchView = function(viewName, filter = 'all') {
            window.appState.currentView = viewName;
            if (viewName === 'transactions') {
                window.appState.trxFilter = filter;
            }
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            let activeBtnId = 'nav-dashboard';
            if (viewName === 'transactions' || viewName === 'pos') activeBtnId = 'nav-transactions';
            else if (viewName === 'master') activeBtnId = 'nav-master';
            else if (viewName === 'reports') activeBtnId = 'nav-reports';
            else if (viewName === 'settings') activeBtnId = 'nav-settings';

            const activeBtn = document.getElementById(activeBtnId);
            if(activeBtn) activeBtn.classList.add('active');

            const titles = {
                'dashboard': 'Dashboard',
                'transactions': 'Daftar Transaksi',
                'pos': 'Transaksi Baru',
                'master': 'Master Data',
                'reports': 'Laporan Keuangan',
                'settings': 'Pengaturan & Nota'
            };
            document.getElementById('header-title').innerText = titles[viewName] || 'Laundry 3D';

            renderCurrentView();
        }

        window.renderCurrentView = function() {
            const container = document.getElementById('view-container');
            container.innerHTML = '';

            switch (window.appState.currentView) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'transactions':
                    container.innerHTML = renderTransactions();
                    break;
                case 'pos':
                    container.innerHTML = renderPOS();
                    break;
                case 'master':
                    container.innerHTML = renderMasterData();
                    break;
                case 'reports':
                    container.innerHTML = renderReports();
                    break;
                case 'settings':
                    container.innerHTML = renderSettings();
                    break;
            }
        };

        function renderDashboard() {
            const trxs = window.appState.transactions;
            const omset = trxs.filter(t => t.status !== 'Batal')
                              .reduce((sum, t) => sum + (Number(t.paidAmount) || (t.paymentStatus === 'Lunas' ? Number(t.total) : 0) || 0), 0);
            
            const totalMasuk = trxs.length;
            const activeTrxCount = trxs.filter(t => t.status !== 'Selesai' && t.status !== 'Batal').length;

            return `
                <div class="card-3d-blue p-6 mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-semibold opacity-90">Total Omset (Diterima)</h3>
                        <span class="icon-3d text-3xl">💰</span>
                    </div>
                    <h2 class="text-3xl font-bold">${formatRp(omset)}</h2>
                    <p class="text-xs opacity-75 mt-2">Akumulasi pembayaran masuk</p>
                </div>

                <div class="clay-card p-4 mb-4 flex justify-between items-center cursor-pointer hover:scale-[1.01] transition-transform" onclick="switchView('transactions', 'all')">
                    <div class="flex items-center gap-3">
                        <span class="icon-3d text-2xl">📥</span>
                        <div>
                            <h4 class="font-bold text-gray-800">Total Transaksi Masuk</h4>
                            <p class="text-xs text-gray-500">Semua order tercatat</p>
                        </div>
                    </div>
                    <span class="text-xl font-bold text-indigo-600">${totalMasuk}</span>
                </div>

                <!-- Simplified Single Card for Proses Pengerjaan Order -->
                <div onclick="switchView('transactions', 'all')" class="clay-card p-5 mb-6 cursor-pointer hover:scale-[1.01] transition-transform flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="icon-3d text-3xl">📋</span>
                        <div>
                            <h3 class="font-bold text-gray-800 text-base">Proses Pengerjaan Order</h3>
                            <p class="text-xs text-gray-500 mt-0.5">Kelola antrian, proses, & siap ambil</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xl font-bold text-indigo-600">${activeTrxCount} Aktif</span>
                        <span class="block text-[10px] text-gray-400">Ketuk untuk detail</span>
                    </div>
                </div>

                <div class="mt-4 flex justify-center">
                    <button onclick="switchView('pos')" class="clay-btn clay-btn-primary w-full py-4 text-lg flex justify-center items-center gap-2">
                        <span class="text-2xl">➕</span> Buat Transaksi Baru
                    </button>
                </div>
            `;
        }

                function renderTransactions() {
            const trxs = window.appState.transactions;
            const filter = window.appState.trxFilter || 'all';

            let filteredTrxs = trxs;
            if (filter !== 'all') {
                filteredTrxs = trxs.filter(t => t.status === filter);
            }
            
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="font-bold text-gray-700">Daftar Order ${filter !== 'all' ? `(${filter})` : ''}</h2>
                    </div>
                    <button onclick="switchView('pos')" class="clay-btn bg-white px-3 py-1 text-sm font-bold text-indigo-600">+ Baru</button>
                </div>
                
                <!-- Kotak Pencarian Baru -->
                <div class="mb-4">
                    <input type="text" class="clay-input w-full text-sm font-medium" placeholder="🔍 Cari nama pelanggan di sini..." oninput="window.searchTrx(this.value)">
                </div>

                <div class="flex gap-2 overflow-x-auto pb-2 mb-4 text-xs">
                    <button onclick="switchView('transactions', 'all')" class="clay-btn px-3 py-1.5 ${filter === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}">Semua</button>
                    <button onclick="switchView('transactions', 'Antrian')" class="clay-btn px-3 py-1.5 ${filter === 'Antrian' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}">Antrian</button>

//fungsi pencarian pelanggan
        window.toggleCustomerDropdown = function(show) {
            const list = document.getElementById('customer-dropdown-list');
            if (!list) return;
            
            if (show) {
                list.classList.remove('hidden');
                filterCustomerDropdown(''); // Tampilkan semua saat pertama klik

                list.classList.add('hidden');
                document.getElementById('pos-customer-search').value = '';
                document.getElementById('pos-customer').value = '';
            }
        };

        window.filterCustomerDropdown = function(query) {
            const list = document.getElementById('customer-dropdown-list');
            if (!list) return;

            const customers = window.appState.customers;
            const lowerQuery = query.toLowerCase();
            
            const filtered = customers.filter(c => c.name.toLowerCase().includes(lowerQuery) || (c.phone && c.phone.includes(lowerQuery)));

            if (filtered.length === 0) {
                list.innerHTML = `<div class="p-3 text-sm text-gray-500 text-center">Pelanggan tidak ditemukan</div>`;

            let html = '';
            filtered.forEach(c => {

        window.selectCustomerForPos = function(id, name) {
            document.getElementById('pos-customer').value = id;
            document.getElementById('pos-customer-search').value = name;
            document.getElementById('customer-dropdown-list').classList.add('hidden');
        };
        
        
        window.togglePosPaymentFields = function() {
            const payStatus = document.getElementById('pos-payment').value;
            const dpContainer = document.getElementById('pos-dp-container');
            const cashContainer = document.getElementById('pos-cash-container');
            
            if (payStatus === 'DP') {
                dpContainer.classList.remove('hidden');
                cashContainer.classList.add('hidden');
            } else if (payStatus === 'Lunas') {
                dpContainer.classList.add('hidden');
                cashContainer.classList.remove('hidden');
            } else {
                dpContainer.classList.add('hidden');
                cashContainer.classList.add('hidden');
            }
            calculateChange();
        };

        window.calculatePosTotal = function() {
            const servEl = document.getElementById('pos-service');
            const qty = parseFloat(document.getElementById('pos-qty').value) || 0;
            let total = 0;
            if (servEl && servEl.selectedIndex > 0) {
                const price = parseFloat(servEl.options[servEl.selectedIndex].dataset.price) || 0;
                total = price * qty;
            }
            const totalDisplay = document.getElementById('pos-total-display');
            if(totalDisplay) totalDisplay.innerText = formatRp(total);
            calculateChange();
            return total;
        };

        window.calculateChange = function() {
            const total = window.calculatePosTotal();
            const payStatus = document.getElementById('pos-payment')?.value || 'Belum Lunas';
            
            if (payStatus === 'DP') {
                const dpInput = parseFloat(document.getElementById('pos-dp-amount')?.value) || 0;
                const sisa = Math.max(0, total - dpInput);
                const sisaDisplay = document.getElementById('pos-sisa-display');
                if (sisaDisplay) sisaDisplay.innerText = formatRp(sisa);
            } else if (payStatus === 'Lunas') {
                const cashInput = parseFloat(document.getElementById('pos-cash-amount')?.value) || 0;
                const change = Math.max(0, cashInput - total);
                const changeDisplay = document.getElementById('pos-change-display');
                if (changeDisplay) changeDisplay.innerText = formatRp(change);
            }
        };

        window.saveTransaction = async function() {
            const custEl = document.getElementById('pos-customer');
            const servEl = document.getElementById('pos-service');
            const qtyEl = document.getElementById('pos-qty');
            const payEl = document.getElementById('pos-payment');
            const payMethodEl = document.getElementById('pos-payment-method');

            if (!custEl || !servEl || !qtyEl || !payEl) {
                showToast("Form tidak lengkap!", "⚠️");
                return;
            }

            const custId = custEl.value;
            const servId = servEl.value;
            const qty = parseFloat(qtyEl.value);
            const paymentStatus = payEl.value;
            const paymentMethod = payMethodEl ? payMethodEl.value : 'Tunai';

            if (!custId || !servId || isNaN(qty) || qty <= 0) {
                showToast("Pilih pelanggan, layanan, dan jumlah yang benar!", "⚠️");
                return;
            }

            const customer = window.appState.customers.find(c => c.id === custId);
            const service = window.appState.services.find(s => s.id === servId);
            
            if (!customer || !service) {
                showToast("Data pelanggan atau layanan tidak ditemukan", "❌");
                return;
            }

            const total = service.price * qty;
            let paidAmount = 0;
            if (paymentStatus === 'Lunas') {
                paidAmount = total;
            } else if (paymentStatus === 'DP') {
                paidAmount = parseFloat(document.getElementById('pos-dp-amount')?.value) || 0;
                if (paidAmount <= 0) {
                    showToast("Masukkan jumlah DP dengan benar!", "⚠️");
                    return;
                }
            } else {
                paidAmount = 0;
            }

            const trxData = {
                customerId: custId,
                customerName: customer.name,
                serviceId: servId,
                serviceName: `${service.name} (${service.category})`,
                qty: qty,
                total: total,
                paidAmount: paidAmount,
                status: 'Antrian',
                paymentStatus: paymentStatus,
                paymentMethod: paymentMethod
            };

            const btn = document.getElementById('btn-save-trx');
            if (btn) {
                btn.innerText = "Menyimpan...";
                btn.disabled = true;
            }

            try {
                await window.dbActions.addTransaction(trxData);
                showToast("Transaksi Berhasil!", "✅");
                switchView('transactions', 'all');
            } catch (e) {
                console.error(e);
                showToast("Gagal menyimpan transaksi", "❌");
                if (btn) {
                    btn.innerText = "Simpan Transaksi";
                    btn.disabled = false;
                }
            }
        };

                window.openCustomerDetailModal = function(customerId) {

            const trxs = window.appState.transactions.filter(t => t.customerId === customerId);
            const activeTrxs = trxs.filter(t => t.status !== 'Batal');
            
            // LOGIKA BARU: Hanya menghitung SISA yang belum dibayar (Hutang)
            const sisaHutang = activeTrxs.reduce((sum, t) => {
                const payStatus = t.paymentStatus || 'Belum Lunas';
                const paid = Number(t.paidAmount) || (payStatus === 'Lunas' ? Number(t.total) : 0);
                const sisa = Math.max(0, Number(t.total) - paid);

        window.openReportDetailModal = function(filterType) {

                        window.filterReportList = function(filterType) {
            const startDate = document.getElementById('report-start-date').value;
            const endDate = document.getElementById('report-end-date').value;
            const payFilter = document.getElementById('report-filter-pay').value;
            const methodFilter = document.getElementById('report-filter-method').value;
            const container = document.getElementById('report-items-container');
            
            // JANGAN DIHAPUS: Ini yang memunculkan kotak total
            const totalContainer = document.getElementById('report-total-container');
            const totalAmountSpan = document.getElementById('report-total-amount');
            
            if (!container) return;

            let trxs = window.appState.transactions;
            if (filterType === 'lunas') trxs = trxs.filter(t => t.paymentStatus === 'Lunas');
            else if (filterType === 'dp') trxs = trxs.filter(t => t.paymentStatus === 'DP');
            else if (filterType === 'belum') trxs = trxs.filter(t => !t.paymentStatus || t.paymentStatus === 'Belum Lunas');
            else if (filterType === 'selesai') trxs = trxs.filter(t => t.status === 'Selesai');
            else if (filterType === 'batal') trxs = trxs.filter(t => t.status === 'Batal');

            if (payFilter !== 'all') {
                trxs = trxs.filter(t => (t.paymentStatus || 'Belum Lunas') === payFilter);
            }

            if (methodFilter !== 'all') {
                trxs = trxs.filter(t => (t.paymentMethod || 'Tunai') === methodFilter);
            }

            if (startDate || endDate) {
                trxs = trxs.filter(t => {
                    if (!t.createdAt) return false;
                    const d = new Date(t.createdAt);
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    const formatted = `${yyyy}-${mm}-${dd}`;

                    if (startDate && formatted < startDate) return false;
                    if (endDate && formatted > endDate) return false;
                    return true;
                });
            }

            let html = '';
            let currentTotal = 0;

            if (trxs.length === 0) {
                html = `<div class="text-center text-gray-400 py-6 text-sm">Tidak ada transaksi yang cocok</div>`;
                if(totalContainer) totalContainer.classList.add('hidden');
            } else {
                if(totalContainer) totalContainer.classList.remove('hidden');
                
                trxs.forEach(t => {
                    currentTotal += Number(t.total);
                    const payStatus = t.paymentStatus || 'Belum Lunas';
                    const payMethod = t.paymentMethod || 'Tunai';
                    const paid = Number(t.paidAmount) || (payStatus === 'Lunas' ? Number(t.total) : 0);
                    
                    // KODE KLIK DETAIL: Ada tambahan 'onclick' dan 'cursor-pointer'
                    html += `
                        <div class="bg-white/90 p-3 rounded-xl border border-gray-200 text-xs space-y-1 shadow-sm cursor-pointer hover:bg-gray-50 transition-colors" onclick="openTransactionDetailModal('${t.id}')">
                            <div class="flex justify-between font-bold text-gray-800">
                                <span>${t.customerName}</span>
                                <span class="text-indigo-600">${formatRp(t.total)}</span>
                            </div>
                            <div class="text-gray-500">${t.serviceName} (${t.qty}) • ${formatDate(t.createdAt)}</div>
                            <div class="flex justify-between items-center pt-1 border-t border-gray-100">
                                <span class="status-badge bg-gray-100 text-gray-700">${t.status}</span>
                                <span class="font-semibold text-green-600">Bayar: ${formatRp(paid)} (${payStatus} / ${payMethod})</span>
                            </div>
                        </div>
                    `;
                });
                
                if(totalAmountSpan) totalAmountSpan.innerText = formatRp(currentTotal);
            }
            container.innerHTML = html;
        };

                            <option value="Kasir / Admin" ${data.role === 'Kasir / Admin' ? 'selected' : ''}>Kasir / Admin</option>
                            <option value="Kurir" ${data.role === 'Kurir' ? 'selected' : ''}>Kurir</option>
                        </select>
                    </div>
                `;
                saveBtn.onclick = async () => {
                    const nData = {
                        name: document.getElementById('f-name').value,
                        role: document.getElementById('f-role').value
                    };
                    if(!nData.name) return showToast("Nama wajib diisi", "⚠️");
                    const originalText = saveBtn.innerText;
                    saveBtn.innerText = "Menyimpan...";
                    saveBtn.disabled = true;
                    try {
                        if(id) await window.dbActions.updateEmployee(id, nData);
                        else await window.dbActions.addEmployee(nData);
                        closeModal(); 
                        showToast("Karyawan disimpan", "✅");
                        window.renderMasterContent('employees');
                    } catch(e) {
                        showToast("Terjadi kesalahan", "❌");
                    } finally {
                        saveBtn.innerText = originalText;
                        saveBtn.disabled = false;
                    }
                };
            }

            body.innerHTML = html;
        }

        function closeModal() {
            const content = document.getElementById('form-modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('form-modal').classList.add('hidden');
            }, 300);
        }

        window.openStatusModal = function(trxId) {
            const trx = window.appState.transactions.find(t => t.id === trxId);
            if(!trx) return;

            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            const body = document.getElementById('modal-body');
            const title = document.getElementById('modal-title');
            const saveBtn = document.getElementById('modal-save-btn');
            
            saveBtn.style.display = 'block';
            title.innerText = 'Update Proses & Pembayaran';
            
            const statuses = ['Antrian', 'Proses', 'Siap Ambil', 'Selesai', 'Batal'];
            let statOptions = statuses.map(s => `<option value="${s}" ${trx.status === s ? 'selected' : ''}>${s}</option>`).join('');
            
            const payStatuses = ['Belum Lunas', 'DP', 'Lunas'];
            let payOptions = payStatuses.map(p => `<option value="${p}" ${trx.paymentStatus === p ? 'selected' : ''}>${p}</option>`).join('');

            const currentPaid = Number(trx.paidAmount) || (trx.paymentStatus === 'Lunas' ? Number(trx.total) : 0);

            body.innerHTML = `
                <div class="mb-4 bg-gray-100 p-3 rounded-lg text-sm space-y-1">
                    <strong>Pelanggan:</strong> ${trx.customerName}<br>
                    <strong>Layanan:</strong> ${trx.serviceName} (${trx.qty})<br>
                    <strong>Total Tagihan:</strong> ${formatRp(trx.total)}
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">Ubah Status Pengerjaan</label>
                    <select id="s-status" class="clay-input bg-white">${statOptions}</select>
                </div>
                <div class="mt-3">
                    <label class="text-xs font-bold text-gray-500">Status Pembayaran</label>
                    <select id="s-pay" class="clay-input bg-white" onchange="toggleModalPaymentFields('${trx.total}')">${payOptions}</select>
                </div>
                <div class="mt-3" id="modal-paid-container">
                    <label class="text-xs font-bold text-gray-500">Jumlah Uang Telah Dibayar (Rp)</label>
                    <input type="number" id="s-paid" class="clay-input" value="${currentPaid}">
                </div>
            `;

                        saveBtn.onclick = async () => {
                const newStatus = document.getElementById('s-status').value;
                const newPay = document.getElementById('s-pay').value;
                const newPaidAmount = parseFloat(document.getElementById('s-paid').value) || 0;
                
                if(newStatus === 'Batal' && trx.status !== 'Batal') {
                    openConfirm('Batalkan Transaksi?', 'Jika dibatalkan, status akan berubah menjadi batal.', async () => {
                        await window.dbActions.updateTransaction(trxId, { status: newStatus, paymentStatus: newPay, paidAmount: newPaidAmount });
                        closeModal(); 
                        showToast("Status Diupdate", "✅");
                        window.renderCurrentView();
                    });
                } else {
                    const originalText = saveBtn.innerText;
                    saveBtn.innerText = "Updating...";
                    saveBtn.disabled = true;
                    try {
                        await window.dbActions.updateTransaction(trxId, { status: newStatus, paymentStatus: newPay, paidAmount: newPaidAmount });
                        closeModal();
                        showToast("Status Diupdate", "✅");
                        window.renderCurrentView();
                    } catch (e) {
                        showToast("Gagal update", "❌");
                    } finally {
                        saveBtn.innerText = originalText;
                        saveBtn.disabled = false;
                    }
                }
            };
            

            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
        };

        window.toggleModalPaymentFields = function(totalVal) {
            const payVal = document.getElementById('s-pay').value;
            const paidInput = document.getElementById('s-paid');
            if (payVal === 'Lunas') {
                paidInput.value = totalVal;
            }
        };

        function openConfirm(title, msg, onYes) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            const yesBtn = document.getElementById('confirm-yes-btn');
            yesBtn.onclick = () => {
                onYes();
                closeConfirm();
            };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirm() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

                  window.printReceipt = function(trxId) {
            const trx = window.appState.transactions.find(t => t.id === trxId);
            if(!trx) return;

            const s = window.appState.settings;
            const printArea = document.getElementById('print-area');
            const d = new Date(trx.createdAt || Date.now());
            const payStatus = trx.paymentStatus || 'Belum Lunas';
            const paid = Number(trx.paidAmount) || (payStatus === 'Lunas' ? Number(trx.total) : 0);
            const sisa = Math.max(0, Number(trx.total) - paid);
            
            const noteText = s.receiptNote !== undefined ? s.receiptNote : 'Terima Kasih\nPakaian bersih hati gembira';
            const noteHtml = noteText.split('\n').map(line => `<p style="margin:0;">${line}</p>`).join('');

            let html = '';
            if (!s.hideLogo) {
                html += `<div style="text-align: center; margin-bottom: 5px; font-size: 16px;">🧺</div>`;
            }
            if (!s.hideOutletName) {
                html += `
                    <div style="text-align: center; margin-bottom: 8px;">
                        <h2 style="margin:0; font-size: 15px; font-weight: bold;">${s.outletName}</h2>
                        <p style="margin:0; font-size: 10px;">${s.outletAddress}</p>
                        <p style="margin:0; font-size: 10px;">Telp: ${s.outletPhone}</p>
                    </div>
                    <div style="border-bottom: 1px dashed black; margin-bottom: 5px;"></div>
                `;
            }

            html += `<div style="font-size: 11px; margin-bottom: 5px;">`;
            if (s.showTrxNumber) {
                html += `<div>No: TRX-${trx.id.slice(-6).toUpperCase()}</div>`;
            }
            html += `
                    <div>Tgl: ${d.toLocaleDateString('id-ID')} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}</div>
                    <div>Plg: ${trx.customerName}</div>
                </div>
                <div style="border-bottom: 1px dashed black; margin-bottom: 5px;"></div>
                <table style="width: 100%; font-size: 11px;">
                    <tr>
                        <td colspan="2">${trx.serviceName}</td>
                    </tr>
                    <tr>
                        <td>${trx.qty} x</td>
                        <td style="text-align: right;">${formatRp(trx.total)}</td>
                    </tr>
                </table>
                <div style="border-bottom: 1px dashed black; margin-top: 5px; margin-bottom: 5px;"></div>
                <table style="width: 100%; font-size: 11px; font-weight: bold;">
                    <tr>
                        <td>TOTAL</td>
                        <td style="text-align: right;">${formatRp(trx.total)}</td>
                    </tr>
                    <tr>
                        <td>STATUS</td>
                        <td style="text-align: right;">${payStatus.toUpperCase()}</td>
                    </tr>
                    <tr>
                        <td>DIBAYAR</td>
                        <td style="text-align: right;">${formatRp(paid)}</td>
                    </tr>
                    ${sisa > 0 ? `<tr><td>SISA</td><td style="text-align: right;">${formatRp(sisa)}</td></tr>` : ''}
                </table>
                <div style="border-bottom: 1px dashed black; margin-top: 5px; margin-bottom: 10px;"></div>
                <div style="text-align: center; font-size: 10px;">
                    ${noteHtml}
                </div>
            `;
            
            printArea.innerHTML = html;
            window.print();
        };

        window.shareTransaction = async function(trxId) {
            const trx = window.appState.transactions.find(t => t.id === trxId);
            if(!trx) return;

            const s = window.appState.settings;
            const payStatus = trx.paymentStatus || 'Belum Lunas';
            const paid = Number(trx.paidAmount) || (payStatus === 'Lunas' ? Number(trx.total) : 0);
            const sisa = Math.max(0, Number(trx.total) - paid);
            const d = new Date(trx.createdAt || Date.now());
            const dateStr = d.toLocaleDateString('id-ID') + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            const hargaSatuan = trx.qty > 0 ? (trx.total / trx.qty) : trx.total;

            let msg = '';
            
            // Header menyerupai print struk
            if (!s.hideOutletName) {
                msg += `*${s.outletName.toUpperCase()}*\n`;
                msg += `${s.outletAddress}\n`;
                msg += `Telp: ${s.outletPhone}\n`;
                msg += `--------------------------------\n`;
            }
            
            if (s.showTrxNumber) {
                msg += `No  : TRX-${trx.id.slice(-6).toUpperCase()}\n`;
            }
            msg += `Tgl : ${dateStr}\n`;
            msg += `Plg : ${trx.customerName}\n`;
            msg += `--------------------------------\n`;
            
            // Detail Pesanan
            msg += `*${trx.serviceName}*\n`;
            msg += `${trx.qty} x ${formatRp(hargaSatuan)} = *${formatRp(trx.total)}*\n`;
            msg += `--------------------------------\n`;
            
            // Total & Pembayaran
            msg += `TOTAL   : *${formatRp(trx.total)}*\n`;
            msg += `STATUS  : ${payStatus.toUpperCase()}\n`;
            msg += `DIBAYAR : ${formatRp(paid)}\n`;
            if (sisa > 0) {
                msg += `SISA    : ${formatRp(sisa)}\n`;
            }
            msg += `--------------------------------\n`;
            
            // Catatan Kustom (Diambil dari Pengaturan)
            const noteText = s.receiptNote !== undefined ? s.receiptNote : 'Terima Kasih\nPakaian bersih hati gembira';
            msg += noteText;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: `Nota Laundry - ${trx.customerName}`,
                        text: msg
                    });
                } catch (err) {
                    console.log("Share dibatalkan", err);
                }
            } else {
                try {
                    await navigator.clipboard.writeText(msg);
                    showToast("Teks nota berhasil disalin!", "📋");
                } catch (err) {
                    showToast("Gagal membagikan", "❌");
                }
            }
        };

        // ==== SISTEM PENGENDALI TOMBOL BACK MULTI-TAHAP ====
        
        // 1. Memanipulasi navigasi menu utama (switchView)
        const oriSwitchView = window.switchView;
        window.switchView = function(viewName, filter = 'all', isBack = false) {
            // Jika perpindahan ini bukan dari usapan tombol back, catat ke riwayat HP
            if (!isBack) {
                history.pushState({ view: viewName, filter: filter }, "");
            }
            oriSwitchView(viewName, filter);
        };

        // 2. Memanipulasi saat jendela pop-up (Modal) terbuka
        const oriOpenStatus = window.openStatusModal;
        window.openStatusModal = function(trxId) {
            history.pushState({ modalOpen: true }, ""); 
            oriOpenStatus(trxId);
        };

        const oriOpenForm = window.openFormModal;
        window.openFormModal = function(type, id) {
            history.pushState({ modalOpen: true }, "");
            oriOpenForm(type, id);
        };

                // 3. Menangkap perintah usap layar / tombol Back fisik berurutan
        window.addEventListener('popstate', function(event) {
            const formModal = document.getElementById('form-modal');
            const confirmModal = document.getElementById('confirm-modal');
            const trxDetailModal = document.getElementById('trx-detail-modal'); // Modal baru
            
            // Tahap 1: Tutup modal konfirmasi batal
            if (confirmModal && !confirmModal.classList.contains('hidden')) {
                confirmModal.classList.add('hidden');
                return;
            }

            // Tahap 2: Tutup modal detail transaksi terlebih dahulu jika sedang terbuka
            if (trxDetailModal && !trxDetailModal.classList.contains('hidden')) {
                const content = document.getElementById('trx-detail-modal-content');
                content.classList.add('translate-y-full');
                setTimeout(() => { trxDetailModal.classList.add('hidden'); }, 300);
                return;
            }

            // Tahap 3: Tutup modal form/proses
            if (formModal && !formModal.classList.contains('hidden')) {
                const content = document.getElementById('form-modal-content');
                content.classList.add('translate-y-full');
                setTimeout(() => { formModal.classList.add('hidden'); }, 300);
                return;
            }

            // Tahap 4: Kembali ke halaman sebelumnya
            if (event.state && event.state.view) {
                window.switchView(event.state.view, event.state.filter, true); 
            } else {
                window.switchView('dashboard', 'all', true);
            }
        });
        

        // 4. Sinkronisasi tombol silang (Batal/Tutup manual) dengan usapan layar
        const oriCloseModal = window.closeModal;
        window.closeModal = function() {
            if (history.state && history.state.modalOpen) {
                history.back(); // Memicu usapan mundur secara halus
            } else {
                oriCloseModal();
            }
        };

        // 5. Daftarkan halaman pertama sebagai pondasi riwayat saat aplikasi dibuka
        window.addEventListener('load', () => {
            history.replaceState({ view: 'dashboard', filter: 'all' }, "");
        });

        // fungsi pencarian pd transaksi
        window.searchTrx = function(query) {
            const lowerQuery = query.toLowerCase();
            const cards = document.querySelectorAll('.trx-card-item');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(lowerQuery)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            // Tampilkan pesan jika pelanggan tidak ditemukan
            const emptyMsg = document.getElementById('empty-search-msg');
            if (emptyMsg) {
                if (visibleCount === 0 && cards.length > 0) {
                    emptyMsg.classList.remove('hidden');
                } else {
                    emptyMsg.classList.add('hidden');
                }
            }
        };

                window.openTransactionDetailModal = function(trxId) {
            const trx = window.appState.transactions.find(t => t.id === trxId);
            if (!trx) return;

            const modal = document.getElementById('trx-detail-modal');

                <div class="space-y-2">

                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Tanggal:</span>
                        <span>${formatDate(trx.createdAt)}</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Pelanggan:</span>
                        <span class="font-bold">${trx.customerName}</span>

                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Layanan:</span>
                        <span>${trx.serviceName} (${trx.qty})</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Status:</span>
                        <span class="font-bold text-indigo-600">${trx.status}</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Metode Bayar:</span>
                        <span>${payMethod}</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Status Bayar:</span>
                        <span class="font-bold ${payStatus === 'Lunas' ? 'text-green-600' : 'text-orange-500'}">${payStatus}</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-gray-600">Dibayar:</span>
                        <span>${formatRp(paid)}</span>
                    </div>
                    ${sisa > 0 ? `
                        <div class="flex justify-between border-b pb-2">
                            <span class="font-bold text-gray-600">Sisa:</span>
                            <span class="font-bold text-red-500">${formatRp(sisa)}</span>
                        </div>
                    ` : ''}
                    <div class="flex justify-between pt-2">
                        <span class="font-bold text-gray-800 text-lg">Total Tagihan:</span>
                        <span class="font-bold text-indigo-700 text-lg">${formatRp(trx.total)}</span>
                    </div>
                </div>
            `;

            history.pushState({ trxModalOpen: true }, "");
            body.innerHTML = html;
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
        };

        window.closeTrxDetailModal = function() {
            const content = document.getElementById('trx-detail-modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('trx-detail-modal').classList.add('hidden');
            }, 300);
        };
        
        
    </script>
</body>
</html>
